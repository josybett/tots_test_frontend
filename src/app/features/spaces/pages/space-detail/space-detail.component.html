<div class="top-banner flex align-items-center p-3">
  <button (click)="goBack()" class="back-button p-button-text p-button-rounded" aria-label="Go back" data-cy="back-button">
    <i class="pi pi-arrow-left"></i>
  </button>
</div>

@if (space()) {
  <div class="grid">
    <div class="col-12 md:col-8 space-details-main-content">
      <app-image-gallery [images]="images"></app-image-gallery>

      <div class="mt-4">
        <h1 class="text-3xl font-bold">{{ space()?.name }}</h1>
      </div>

      <p-accordion [multiple]="false" styleClass="mt-5">
        <p-accordionTab header="Descripción">
          <p class="mt-2 text-lg">{{ space()?.description }}</p>
        </p-accordionTab>
        <p-accordionTab header="Servicios">
          <div class="amenities">
            <ul class="grid list-none p-0 m-0">
              @for (amenity of amenities; track amenity.name) {
                <li class="col-6 md:col-4 lg:col-3 flex items-center mb-2" [attr.data-cy]="'amenity-' + amenity.name.toLowerCase().replace(' ', '-')">
                  <i [class]="amenity.icon + ' text-xl mr-2'" aria-hidden="true"></i>
                  <span>{{ amenity.name }}</span>
                </li>
              }
            </ul>
          </div>
        </p-accordionTab>
        <p-accordionTab header="Disponibilidad">
          <app-availability-calendar></app-availability-calendar>
        </p-accordionTab>
      </p-accordion>
    </div>
    <div class="col-12 md:col-4">
      <app-booking-form></app-booking-form>
    </div>
  </div>
} @else {
  <p class="p-4">Espacio no encontrado.</p>
}
