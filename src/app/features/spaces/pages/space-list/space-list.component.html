<div class="grid">
  <div class="col-12 md:col-4 lg:col-3 pr-md-4 sticky-filters">
    <app-filters data-cy="filters-section"></app-filters>
  </div>
  <div class="col-12 md:col-8 lg:col-9">
    <h1 class="text-2xl font-bold mb-4" data-cy="available-spaces-title">
      Available Spaces ({{ spaces.length }} found)
    </h1>
    <div class="grid">
      @for (space of spaces; track space.id) {
        <div class="col-12 lg:col-6 xl:col-4 mb-4">
          <app-space-card [space]="space"></app-space-card>
        </div>
      }
    </div>
  </div>
</div>

@if (showScrollTopButton()) {
  <p-button
    icon="pi pi-arrow-up"
    styleClass="p-button-rounded scroll-top-button md:hidden"
    (onClick)="scrollToTop()"
    data-cy="scroll-top-button"
  ></p-button>
}
