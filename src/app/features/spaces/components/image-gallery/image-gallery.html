@if (images.length > 0) {
  <div class="gallery-container">
    <div class="main-image-container">
      <img [ngSrc]="selectedImage" alt="Selected space image" class="main-image" width="900" height="600" priority />
    </div>
    <div class="thumbnail-container">
      @for (image of images; track image) {
        <img
          [ngSrc]="image"
          alt="Space image thumbnail"
          class="thumbnail"
          [class.selected]="image === selectedImage"
          (click)="selectImage(image)"
          width="150"
          height="100"
        />
      }
    </div>
  </div>
}
