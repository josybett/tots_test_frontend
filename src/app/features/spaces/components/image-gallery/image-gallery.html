@if (images.length > 0) {
  <div class="gallery-container" data-testid="image-gallery">
    <div class="main-image-container">
      <img [ngSrc]="selectedImage" alt="Selected space image" class="main-image" width="900" height="600" priority data-cy="main-image" />
    </div>
    <div class="thumbnail-container">
      @for (image of images; track image; let i = $index) {
        <img
          [ngSrc]="image"
          alt="Space image thumbnail"
          class="thumbnail"
          [class.selected]="image === selectedImage"
          (click)="selectImage(image)"
          (keydown.enter)="selectImage(image)"
          role="button"
          tabindex="0"
          [attr.data-cy]="'thumbnail-' + i"
          width="150"
          height="100"
        />
      }
    </div>
  </div>
}
