<p-card styleClass="space-card" [attr.data-cy]="'space-card-' + space.id">
  <ng-template pTemplate="header">
    <img
      [ngSrc]="space.imageUrl"
      alt="Image of {{ space.name }}"
      width="300"
      height="180"
      class="space-image"
      priority
    />
  </ng-template>

  <h3 class="text-lg font-bold mb-2">{{ space.name }}</h3>

  <div class="tags mb-2">
    <p-tag [value]="'Up to ' + space.capacity + ' People'" styleClass="mr-2"></p-tag>
    <p-tag [value]="space.type" severity="info"></p-tag>
  </div>

  @if (space.available) {
    <div class="availability available mb-2">
      <i class="pi pi-check-circle"></i>
      <span>AVAILABLE</span>
    </div>
  }

  <p class="description text-sm mb-3">{{ space.description }}</p>

  <ng-template pTemplate="footer">
    <div class="flex gap-2">
      <p-button
        label="View Details"
        styleClass="p-button-outlined"
        [routerLink]="['/spaces', space.id]"
        [attr.data-cy]="'view-details-button-' + space.id"
      ></p-button>
      <p-button
        label="Book Now"
        [attr.data-cy]="'book-now-button-' + space.id"
      ></p-button>
    </div>
  </ng-template>
</p-card>
