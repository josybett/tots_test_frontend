<div class="logo"></div>
<div class="mc-auth-basic-container">
  <p-card [header]="config().title ?? 'Iniciar Sesión'" [subheader]="config().subtitle ?? 'Por favor, ingrese sus datos'">

    <form class="" [formGroup]="group" (ngSubmit)="onClickSubmit()">
      <p-iconField iconPosition="left" class="mb-3 w-full">
        <p-inputIcon styleClass="pi pi-envelope" />
        <input type="text" pInputText [placeholder]="config().emailPlaceholder ?? 'Correo electrónico'" formControlName="email" name="email" (keyup.enter)="onClickSubmit()" class="w-full" />
      </p-iconField>

      <p-iconField iconPosition="left" class="w-full">
        <p-inputIcon styleClass="pi pi-lock" />
        <p-password [placeholder]="config().passwordPlaceholder ?? 'Contraseña'" [feedback]="false" [toggleMask]="true" formControlName="password" name="password" (keyup.enter)="onClickSubmit()" inputStyleClass="w-full" styleClass="w-full" />
      </p-iconField>

      @if (config().resetPasswordLink != undefined) {
        <div class="more-actions">
          <p-button [routerLink]="config().resetPasswordLink" [label]="config().resetPassword ?? 'Restablecer Contraseña'" [link]="true" />
        </div>
      }

      @for (message of messages(); track message; let first = $first) {
        <p-message [severity]="message.severity" [text]="message.text" [ngClass]="{ 'mt-4': !first }" />
      }
    </form>

    <ng-template pTemplate="footer">
      <div class="mt-1 w-full">
        <p-button [label]="config().submitButton ?? 'Iniciar Sesión'" [loading]="isSending()" (click)="onClickSubmit()" [disabled]="group.invalid || isSending()" styleClass="w-full" />
      </div>

      @if (config().registerLink != undefined) {
        <div class="more-actions-footer mt-3">
          <p-button [routerLink]="config().registerLink" [label]="config().register ?? '¿No tiene una cuenta? Regístrese'" [link]="true" />
        </div>
      }
    </ng-template>
  </p-card>
</div>
