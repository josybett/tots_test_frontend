<p-toolbar styleClass="topbar">
  <div class="p-toolbar-group-left">
    <div class="logo" routerLink="/" data-cy="logo"></div>
  </div>

  <div class="p-toolbar-group-right">
    <!-- Desktop Navigation -->
    <nav class="nav-links hidden md:flex items-center" aria-label="Main navigation">
      @if (isAdmin) {
        <a routerLink="/admin/spaces" class="desktop-nav-link" routerLinkActive="active-link">Espacios</a>
        <a routerLink="/admin/bookings" class="desktop-nav-link" routerLinkActive="active-link">Reservas</a>
      } @else {
        <a routerLink="/spaces" class="desktop-nav-link" data-cy="desktop-spaces-link">Espacios</a>
        <a routerLink="/my-bookings" class="desktop-nav-link" data-cy="desktop-bookings-link">Mis reservas</a>
      }
    </nav>

    <!-- User Menu -->
    <p-button
      type="button"
      icon="pi pi-user"
      styleClass="p-button-rounded p-button-text"
      (click)="userMenu.toggle($event)"
      aria-label="User Menu"
      data-cy="user-menu-button"
    ></p-button>
    <p-menu #userMenu [model]="userMenuItems" [popup]="true"></p-menu>

    <!-- Hamburger Menu Button -->
    <p-button
      type="button"
      icon="pi pi-bars"
      styleClass="p-button-rounded p-button-text md:hidden"
      (click)="mobileMenu.toggle($event)"
      aria-label="Toggle Navigation"
      aria-controls="mobile-menu"
      data-cy="mobile-menu-button"
    ></p-button>
    <p-menu #mobileMenu [model]="isAdmin ? adminMenuItems : mobileMenuItems" [popup]="true"></p-menu>
  </div>
</p-toolbar>
